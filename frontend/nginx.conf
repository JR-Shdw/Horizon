server {
    listen 8200;
    server_tokens off;
    root /usr/share/nginx/html;
    index index.html;

    # SPA, single page
    location / {
        try_files $uri /index.html;
    }

    # Proxy API to backend, backup restore (large payloads)
    location /api/v1/vault/backup/ {
        client_max_body_size ${MAX_BODY_BACKUP};
        proxy_pass http://${API_UPSTREAM};
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }

    # Proxy API to backend
    location /api/ {
        client_max_body_size ${MAX_BODY_API};
        proxy_pass http://${API_UPSTREAM};
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;  # Argon2id is slow
    }

    # Health passthrough
    location /health {
        proxy_pass http://${API_UPSTREAM};
    }

    # Security headers
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy no-referrer always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'sha256-ob3W70lEt90shORYCyzALjqZABqmWyGuqVY0XtPFBuU='; style-src 'self'; connect-src 'self'" always;
    # Secret-bearing API responses must never be cached by intermediaries
    # or the browser. Set at server level so /api/, /api/v1/vault/backup/
    # and the SPA shell inherit it. The js/css + sw.js locations declare
    # their own Cache-Control (and thus their own add_header), so nginx
    # does not apply this to them, their caching policy is unchanged.
    add_header Cache-Control "no-store" always;
    add_header X-Forwarded-Proto $scheme always;
    # AI / TDM reservation, see /LICENSE-AI.md and /.well-known/tdmrep.json
    add_header X-Robots-Tag "noai, noimageai, noindex, nofollow" always;
    add_header tdm-reservation "1" always;
    add_header Link "</LICENSE-AI.md>; rel=\"license\"" always;

    # robots.txt + ai.txt + well-known
    location = /robots.txt {
        add_header Content-Type "text/plain; charset=utf-8";
        try_files $uri =404;
    }
    location = /ai.txt {
        add_header Content-Type "text/plain; charset=utf-8";
        try_files $uri =404;
    }
    location ^~ /.well-known/ {
        add_header Content-Type "application/json; charset=utf-8";
        try_files $uri =404;
    }

    # No cache on JS/CSS (force fresh on deploy)
    location ~* \.(js|css)$ {
        add_header Cache-Control "no-cache, must-revalidate";
        try_files $uri =404;
    }

    # Service worker must not be cached
    location = /sw.js {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        try_files $uri =404;
    }

    # Gzip
    gzip on;
    gzip_types text/css application/javascript application/json application/manifest+json;
    gzip_min_length 256;
}

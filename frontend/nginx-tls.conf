# Upstream connection pool to uvicorn API.
#
# Why : the bench at c=500 surfaced RemoteProtocolError ~0.03 % of
# the time. Diagnosis showed an HTTP/1.1 keep-alive race between the
# client and uvicorn (default uvicorn --timeout-keep-alive=5s).
# nginx in front of the API solves this in two ways :
#
#   1. Multiplexed HTTP/2 from clients (bench, browsers, agents) over
#      a single TCP connection, no per-request keep-alive race ever.
#   2. Persistent upstream pool of long-lived HTTP/1.1 conns to
#      uvicorn, recycled BEFORE uvicorn's --timeout-keep-alive
#      kicks in (25s nginx-side < 30s uvicorn-side, see
#      api/Dockerfile CMD).
#
# Result : the cross-side close race that produced the
# RemoteProtocolError is eliminated structurally, neither side ever
# closes mid-request because the strictly-shorter side closes first
# and the request on it has already drained.
upstream rhorizon_api {
    server ${API_UPSTREAM};
    # 64 idle conns kept warm in the pool (per nginx worker). At c=500
    # spread across 5 uvicorn workers the steady-state in-flight is
    # ~100 per worker ; 64 idle pool fronts that comfortably.
    keepalive 64;
    # MUST be strictly < uvicorn --timeout-keep-alive (30s) so nginx
    # always closes idle upstream conns before uvicorn does. Reverse
    # the inequality and the race comes back.
    keepalive_timeout 25s;
    # Recycle each upstream conn after 1000 requests, defense against
    # slow connection-state leaks (e.g. uvicorn workers drift over
    # long-lived sessions). 1000 reqs at ~250 RPS/worker = ~4s
    # turnover, well below the keepalive_timeout window.
    keepalive_requests 1000;
}

server {
    # http2 enables multiplexed streams over a single TLS connection,
    # which structurally eliminates the per-request keep-alive race
    # for HTTP/2-capable clients. HTTP/1.1 fallback for legacy clients
    # still benefits from the upstream pool above.
    # Port and web root are substituted: the container serves 8443 out of the
    # image's html dir, the native install serves the API port out of the
    # relocated frontend tree. One audited server block, two deployments --
    # duplicating it is how the two postures drift apart.
    #
    # `listen ... http2` is deprecated since nginx 1.25.1 in favour of a separate
    # `http2 on;` directive, and 1.30 warns about it. It is kept deliberately:
    # the replacement does not exist before 1.25.1, and the native path cannot
    # pin its nginx (Debian 12 ships 1.22). The deprecated form is the only
    # spelling every version in the support matrix accepts. Revisit when the
    # oldest supported distro is past 1.25.1.
    listen ${TLS_PORT} ssl http2;
    server_tokens off;

    # CVE-2023-44487 (HTTP/2 Rapid Reset) defence : nginx default is
    # 128 streams but we set it explicit so a future nginx upgrade
    # that changes the default never relaxes our posture. 100 is
    # generous for legitimate HTTP/2 multiplexing (browsers cap at
    # 100, MCP clients use ~10) and small enough that a single
    # client cannot RST-flood the worker.
    http2_max_concurrent_streams 100;

    ssl_certificate ${TLS_CERT};
    ssl_certificate_key ${TLS_KEY};
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384;
    # Post-quantum key exchange (TLS 1.3). X25519MLKEM768 is a hybrid KEM
    # (classical X25519 + ML-KEM-768 / FIPS 203), defeats harvest-now-
    # decrypt-later on the handshake. Listed first so PQ-capable clients
    # negotiate it; X25519/P-256 fallback keeps legacy clients working.
    # Requires OpenSSL >= 3.5 (image ships libssl 3.5.x); on older libssl
    # nginx rejects the unknown group, so do not lower the base image.
    # The native installer cannot pin its libssl, so it probes with `nginx -t`
    # and substitutes the classical list where the group is unknown -- see
    # render_nginx_conf() in tools/lib/common.sh. In the container ${SSL_GROUPS}
    # is always the PQ list.
    ssl_ecdh_curve ${SSL_GROUPS};
    ssl_prefer_server_ciphers on;
    # Cluster mTLS. HA nodes authenticate to each other with certs issued by the
    # cluster CA, but nginx does NOT validate the chain -- optional_no_ca means
    # it requests a cert and forwards whatever is presented; api/app/cluster_mtls.py
    # does the real authentication (CA signature, NotAfter, revocation). Without
    # this, POST /cluster/refresh-cert answers "X-Client-Cert header is required"
    # and node certs silently stop renewing ~30 days before expiry.
    #
    # OFF by default and substituted in, because requesting a client certificate
    # makes some browsers prompt the user to choose one -- unacceptable for a
    # single-node install that will never use it. Enable only on HA members.
${CLIENT_CERT_VERIFY}    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 10m;

    root ${WEB_ROOT};
    index index.html;

    # SPA, single page
    location / {
        try_files $uri /index.html;
    }

    # Proxy API to backend, backup restore (large payloads)
    location /api/v1/vault/backup/ {
        client_max_body_size ${MAX_BODY_BACKUP};
        proxy_pass http://rhorizon_api;
        # proxy_http_version 1.1 + Connection "" required to actually
        # use the upstream keepalive pool, without these nginx opens
        # a fresh conn per request and the pool is dead weight.
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
${CLIENT_CERT_HEADER}        proxy_read_timeout 120s;
    }

    # Proxy API to backend
    location /api/ {
        client_max_body_size ${MAX_BODY_API};
        proxy_pass http://rhorizon_api;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
${CLIENT_CERT_HEADER}        proxy_read_timeout 120s;
    }

    # Health passthrough
    location /health {
        proxy_pass http://rhorizon_api;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
    }

    # Security headers
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy no-referrer always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'sha256-ob3W70lEt90shORYCyzALjqZABqmWyGuqVY0XtPFBuU='; style-src 'self'; connect-src 'self'" always;
    # Secret-bearing API responses must never be cached by intermediaries
    # or the browser. Set at server level so /api/, /api/v1/vault/backup/
    # and the SPA shell inherit it. The js/css location declares its own
    # Cache-Control (its own add_header), so nginx does not apply this to
    # it, its caching policy is unchanged.
    add_header Cache-Control "no-store" always;

    # No cache on JS/CSS (force fresh on deploy)
    location ~* \.(js|css)$ {
        add_header Cache-Control "no-cache, must-revalidate";
        try_files $uri =404;
    }

    # Gzip
    gzip on;
    gzip_types text/css application/javascript application/json;
    gzip_min_length 256;
}

[project]
name = "rhorizon-mcp"
version = "0.9.0b1"
description = "MCP server exposing rhorizon vault ops to any MCP-capable LLM agent (Claude Code, Codex, Cursor, Cline, ...)"
requires-python = ">=3.12"
license = "AGPL-3.0-or-later"
authors = [{name = "shdw"}]
dependencies = []  # ZERO third-party deps -- pure stdlib (json, urllib, ssl, tomllib)

[project.scripts]
rhorizon-mcp-server = "rhorizon_mcp.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["rhorizon_mcp"]

[tool.ruff]
target-version = "py312"
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "W", "I"]

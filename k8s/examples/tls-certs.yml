---
# Certificats TLS depuis rhorizon
#
# Use case : Nginx/reverse proxy qui charge cert + key depuis le vault
# Les certificats sont sur tmpfs, jamais sur disque
#
# Secrets requis dans rhorizon :
#   - tls/cert.pem
#   - tls/key.pem
#
# kubectl apply -f namespace.yml
# kubectl apply -f examples/tls-certs.yml
apiVersion: apps/v1
kind: Deployment
metadata:
  name: nginx-tls
  namespace: rhorizon
  labels:
    app: nginx-tls
spec:
  replicas: 2
  selector:
    matchLabels:
      app: nginx-tls
  template:
    metadata:
      labels:
        app: nginx-tls
    spec:
      serviceAccountName: rhorizon-agent
      volumes:
        - name: certs
          emptyDir:
            medium: Memory
            sizeLimit: 1Mi
        - name: nginx-conf
          configMap:
            name: nginx-tls-conf

      initContainers:
        - name: fetch-certs
          image: git.example.com/shdw/rhorizon-agent:latest
          env:
            - name: RH_ADDR
              valueFrom:
                secretKeyRef:
                  name: rhorizon-token
                  key: addr
            - name: RH_TOKEN
              valueFrom:
                secretKeyRef:
                  name: rhorizon-token
                  key: token
            - name: RH_SECRETS
              value: >-
                tls/cert.pem:/certs/tls.crt,
                tls/key.pem:/certs/tls.key
          volumeMounts:
            - name: certs
              mountPath: /certs
          resources:
            limits:
              memory: 32Mi
              cpu: 100m
          securityContext:
            runAsNonRoot: true
            runAsUser: 65534
            readOnlyRootFilesystem: true
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]

      containers:
        - name: nginx
          image: nginx:stable-alpine
          ports:
            - containerPort: 443
          volumeMounts:
            - name: certs
              mountPath: /certs
              readOnly: true
            - name: nginx-conf
              mountPath: /etc/nginx/conf.d
              readOnly: true
          resources:
            limits:
              memory: 64Mi
              cpu: 200m
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
              add: ["NET_BIND_SERVICE"]
---
apiVersion: v1
kind: Service
metadata:
  name: nginx-tls
  namespace: rhorizon
spec:
  selector:
    app: nginx-tls
  ports:
    - port: 443
      targetPort: 443

# Trivy secret-scanner configuration (--secret-config).
#
# The offline UI demo (frontend/demo.js) ships fabricated sample secrets so the
# interface can be demonstrated live with no backend and no real vault. None of
# these values are real credentials. Trivy does NOT honour the detect-secrets
# `pragma: allowlist secret` comments in that file, so it is whitelisted here by
# path instead.
#
# Scoped to demo.js only: a real secret committed anywhere else in the tree is
# still flagged and still fails the pipeline.
allow-rules:
  - id: frontend-demo-mock-secrets
    description: Fabricated sample secrets in the offline UI demo, no real credentials.
    path: (^|/)demo\.js$

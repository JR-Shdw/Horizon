services:
  postgres-test:
    image: docker.io/library/postgres:18-trixie@sha256:4ef4dbc939d61acea57712655ddb4b4ab27419c913f94cca0cd57cb3ea3c2280
    environment:
      POSTGRES_DB: rhorizon_test
      POSTGRES_USER: rhorizon_test
      POSTGRES_PASSWORD: rhorizon_test
    ports:
      # Host port configurable to avoid collisions (5434 clashes with forgejo's
      # PG on some dev hosts). Override with RH_TEST_PG_PORT.
      - "127.0.0.1:${RH_TEST_PG_PORT:-55434}:5432"
    tmpfs:
      - /var/lib/postgresql

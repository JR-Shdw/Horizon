##
## Drop-in for postfix.service that pulls smtp-relay credentials
## from rhorizon via systemd LoadCredential=. Useful on node-3
## or any host that relays mail through an authenticated upstream
## (e.g. an ISP smarthost, AWS SES, etc.).
##
## Install :
##   mkdir -p /etc/systemd/system/postfix.service.d
##   cp examples/systemd/postfix-with-rhorizon.conf \
##      /etc/systemd/system/postfix.service.d/rhorizon.conf
##   systemctl daemon-reload
##
## Prerequisites :
##   - rhorizon-creds.service running (provides /run/credstore/smtp-relay-pass)
##   - postfix configured to read smtp_sasl_password_maps from a hash
##     file regenerated at start. See ExecStartPre below for the
##     regeneration step.
##
## Password format constraint :
##   The sasl_passwd file is line-delimited "[host]:port user:password\n".
##   Passwords stored in rhorizon for this slot MUST be single-line -
##   any embedded \n will corrupt the file format and break SMTP auth
##   silently. printf double-quotes the substituted value so other
##   shell metacharacters (`, $, ", \) round-trip safely, but \n
##   itself is structural for postmap.
##   Validate at the operator side when storing :
##     value=$(echo -n "$pwd" | tr -d '\n\r') ; rhorizon secret put smtp-relay-pass "$value"

[Unit]
Requires=rhorizon-creds.service
After=rhorizon-creds.service

[Service]
LoadCredential=smtp-relay-pass:/run/credstore/smtp-relay-pass

# Regenerate /etc/postfix/sasl_passwd from the credential at every
# start, then postmap. The %d expands to the unit name. This keeps
# the hashed file fresh after rotation (rhorizon-creds re-runs on
# any password change if you trigger it via path-watcher).
ExecStartPre=/bin/sh -c '\
  printf "[smtp.relay.example.com]:587 %s:%s\\n" "$$RELAY_USER" \
    "$$(cat ${CREDENTIALS_DIRECTORY}/smtp-relay-pass)" \
    > /etc/postfix/sasl_passwd && \
  chmod 600 /etc/postfix/sasl_passwd && \
  /usr/sbin/postmap /etc/postfix/sasl_passwd'

# Set RELAY_USER per-host. Could also come from rhorizon if it's
# considered sensitive (typically not).
Environment=RELAY_USER=relay@example.com

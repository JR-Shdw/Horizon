##
## Drop-in for postgresql.service that pulls the postgres password
## from rhorizon via systemd LoadCredential=.
##
## Install :
##   mkdir -p /etc/systemd/system/postgresql.service.d
##   cp examples/systemd/postgres-with-rhorizon.conf \
##      /etc/systemd/system/postgresql.service.d/rhorizon.conf
##   systemctl daemon-reload
##   systemctl restart postgresql
##
## Prerequisites :
##   - rhorizon-creds.service is running (provides /run/credstore/...)
##   - The secret `postgres-superuser-password` is in the host's
##     namespace and listed in RHORIZON_SECRETS of rhorizon-creds.service
##
## Postgres reads the password from $CREDENTIALS_DIRECTORY/db-password
## via the standard PG_PASSWORD env (or via .pgpass for client tools).
## At boot postgres typically uses the system-default trust auth for
## local connections ; this drop-in is most useful when configuring
## remote replication or a non-trust pg_hba.conf entry.

[Unit]
Requires=rhorizon-creds.service
After=rhorizon-creds.service

[Service]
LoadCredential=db-password:/run/credstore/postgres-superuser-password
# postgres reads PG_PASSWORD or the file referenced by
# PG_PASSWORD_FILE (most postgres setups use ALTER USER on first
# boot ; for replication peers, source the password from the
# credentials dir):
Environment=PGPASSFILE=%S/credentials/db-password

# Built-in dynamic-secret modules. Comment a line (then restart every API node)
# to keep that backend module out of the process. Before disabling a module,
# revoke its leases and delete its engines; startup fails closed otherwise.
#
# Module names map to a closed built-in catalog. Arbitrary Python imports are
# intentionally unsupported.
[modules]
postgresql = enabled
mysql = enabled
ldap = enabled
redis = enabled
cassandra = enabled

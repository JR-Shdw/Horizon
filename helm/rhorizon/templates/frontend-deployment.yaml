{{- if .Values.frontend.enabled -}}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ printf "%s-frontend" (include "rhorizon.fullname" .) }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "rhorizon.labels" . | nindent 4 }}
    app.kubernetes.io/component: frontend
spec:
  replicas: {{ .Values.frontend.replicas }}
  selector:
    matchLabels:
      {{- include "rhorizon.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: frontend
  template:
    metadata:
      labels:
        {{- include "rhorizon.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: frontend
    spec:
      serviceAccountName: {{ include "rhorizon.serviceAccountName" . }}
      {{- with .Values.image.pullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: frontend
          image: {{ include "rhorizon.image.frontend" . }}
          imagePullPolicy: {{ .Values.image.frontend.pullPolicy }}
          ports:
            - containerPort: 8200
              name: http
            {{- if or .Values.frontend.tls.enabled .Values.api.clusterEnabled }}
            - containerPort: 8443
              name: https
            {{- end }}
          env:
            - name: TLS_ENABLED
              value: {{ (or .Values.frontend.tls.enabled .Values.api.clusterEnabled) | quote }}
            - name: RH_CLUSTER_MTLS
              value: {{ .Values.api.clusterEnabled | quote }}
            {{- if or .Values.frontend.tls.enabled .Values.api.clusterEnabled }}
            - name: TLS_CERT
              value: /certs/tls.crt
            - name: TLS_KEY
              value: /certs/tls.key
            {{- end }}
            - name: API_UPSTREAM
              value: "{{ printf "%s-api" (include "rhorizon.fullname" .) }}:{{ .Values.service.api.port }}"
          livenessProbe:
            {{- toYaml .Values.frontend.livenessProbe | nindent 12 }}
          readinessProbe:
            {{- toYaml .Values.frontend.readinessProbe | nindent 12 }}
          resources:
            {{- toYaml .Values.frontend.resources | nindent 12 }}
          securityContext:
            {{- toYaml .Values.frontend.containerSecurityContext | nindent 12 }}
          volumeMounts:
            - name: tmp
              mountPath: /tmp
            - name: nginx-cache
              mountPath: /var/cache/nginx
            - name: nginx-run
              mountPath: /run
            - name: nginx-conf
              mountPath: /etc/nginx/conf.d
            {{- if or .Values.frontend.tls.enabled .Values.api.clusterEnabled }}
            - name: frontend-tls
              mountPath: /certs
              readOnly: true
            {{- end }}
      volumes:
        - name: tmp
          emptyDir:
            medium: Memory
            sizeLimit: 1Mi
        - name: nginx-cache
          emptyDir:
            medium: Memory
            sizeLimit: 8Mi
        - name: nginx-run
          emptyDir:
            medium: Memory
            sizeLimit: 1Mi
        - name: nginx-conf
          {{- if eq .Values.frontend.mode "proxy" }}
          configMap:
            name: {{ printf "%s-frontend-proxy" (include "rhorizon.fullname" .) }}
          {{- else }}
          emptyDir:
            medium: Memory
            sizeLimit: 1Mi
          {{- end }}
        {{- if or .Values.frontend.tls.enabled .Values.api.clusterEnabled }}
        - name: frontend-tls
          secret:
            secretName: {{ .Values.frontend.tls.secretName | default (printf "%s-frontend-tls" (include "rhorizon.fullname" .)) | quote }}
            items:
              - key: {{ .Values.frontend.tls.certKey | quote }}
                path: tls.crt
              - key: {{ .Values.frontend.tls.keyKey | quote }}
                path: tls.key
        {{- end }}
      {{- with .Values.nodeSelector }}
      nodeSelector: {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations: {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity: {{- toYaml . | nindent 8 }}
      {{- end }}
{{- end -}}

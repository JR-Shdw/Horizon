{{- /*
Postgres password secret, generated only when we run PG in-chart.
External PG: the operator provides their own existingSecret.
The `lookup` trick keeps the password stable across `helm upgrade`s
instead of regenerating it (which would lock the chart out of its DB).
*/ -}}
{{- if not .Values.postgres.external.enabled -}}
{{- $existing := (lookup "v1" "Secret" .Release.Namespace (include "rhorizon.postgres.secretName" .)) -}}
{{- $existingPwd := "" -}}
{{- if and $existing $existing.data -}}
  {{- $existingPwd = (index $existing.data "postgres-password" | default "") -}}
{{- end -}}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "rhorizon.postgres.secretName" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "rhorizon.labels" . | nindent 4 }}
type: Opaque
data:
  # Stable across `helm upgrade` : reuse the existing secret value if
  # present, otherwise generate a fresh one. Without this, every
  # upgrade would regenerate the password and lock the API out of PG.
  postgres-password: {{ ternary $existingPwd (randAlphaNum 32 | b64enc) (ne $existingPwd "") | quote }}
{{- end -}}

{{- if and .Values.api.clusterEnabled (not .Values.api.persistence.enabled) -}}
{{- fail "api.clusterEnabled=true requires api.persistence.enabled=true so node identity survives Pod replacement" -}}
{{- end -}}
{{- if and (gt (int .Values.api.replicas) 1) (not .Values.api.clusterEnabled) -}}
{{- fail "api.replicas>1 requires api.clusterEnabled=true; replica count alone is not application HA" -}}
{{- end -}}
{{- if and .Values.api.clusterEnabled (not .Values.frontend.enabled) -}}
{{- fail "api.clusterEnabled=true requires frontend.enabled=true: HA JOIN, certificate renewal and the live preflight all traverse the frontend's HTTPS/mTLS listener, and RH_TLS_ENABLED would otherwise declare a TLS terminator that is not deployed" -}}
{{- end -}}
{{- if and .Values.api.clusterEnabled (not .Values.api.proxyTrustedIps) -}}
{{- fail "api.clusterEnabled=true requires api.proxyTrustedIps set to the frontend Pod CIDR(s)" -}}
{{- end -}}
{{- if and .Values.api.haAutoJoin (not .Values.api.haPrimaryUrl) -}}
{{- fail "api.haAutoJoin=true requires api.haPrimaryUrl" -}}
{{- end -}}
{{- if and .Values.api.haAutoJoin (not .Values.api.haPasswordSecretName) -}}
{{- fail "api.haAutoJoin=true requires api.haPasswordSecretName" -}}
{{- end -}}
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ printf "%s-api" (include "rhorizon.fullname" .) }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "rhorizon.labels" . | nindent 4 }}
    app.kubernetes.io/component: api
spec:
  serviceName: {{ printf "%s-api-headless" (include "rhorizon.fullname" .) }}
  podManagementPolicy: Parallel
  replicas: {{ .Values.api.replicas }}
  updateStrategy:
    type: RollingUpdate
  selector:
    matchLabels:
      {{- include "rhorizon.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: api
  template:
    metadata:
      labels:
        {{- include "rhorizon.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: api
    spec:
      serviceAccountName: {{ include "rhorizon.serviceAccountName" . }}
      {{- with .Values.image.pullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      securityContext:
        {{- toYaml .Values.api.podSecurityContext | nindent 8 }}
      containers:
        - name: api
          image: {{ include "rhorizon.image.api" . }}
          imagePullPolicy: {{ .Values.image.api.pullPolicy }}
          ports:
            - containerPort: 8200
              name: http
          env:
            # POSTGRES_PASSWORD MUST precede RH_DATABASE_URL: k8s only
            # expands $(VAR) for vars defined earlier in the list, else the
            # literal "$(POSTGRES_PASSWORD)" is sent as the DB password.
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ include "rhorizon.postgres.secretName" . }}
                  key: postgres-password
            - name: RH_DATABASE_URL
              value: "postgresql+asyncpg://{{ include "rhorizon.postgres.username" . }}:$(POSTGRES_PASSWORD)@{{ include "rhorizon.postgres.host" . }}:{{ include "rhorizon.postgres.port" . }}/{{ include "rhorizon.postgres.database" . }}"
            # disable|require|verify-full. In-chart PG runs without TLS; an
            # external (Patroni/managed) PG typically requires it.
            - name: RH_DATABASE_SSL
              value: {{ if .Values.postgres.external.enabled }}{{ .Values.postgres.external.sslMode | default "require" | quote }}{{ else }}"disable"{{ end }}
            {{- if .Values.postgres.external.haProvider }}
            - name: RH_DATABASE_HA_PROVIDER
              value: {{ .Values.postgres.external.haProvider | quote }}
            {{- end }}
            {{- if .Values.postgres.external.patroniRestUrls }}
            - name: RH_PATRONI_REST_URLS
              value: {{ .Values.postgres.external.patroniRestUrls | quote }}
            {{- end }}
            - name: RH_CLUSTER_HA_ENABLED
              value: {{ .Values.api.clusterEnabled | quote }}
            - name: RH_TLS_ENABLED
              value: {{ (or .Values.api.clusterEnabled (and .Values.frontend.enabled .Values.frontend.tls.enabled)) | quote }}
            - name: RH_CLUSTER_IDENTITY_PERSISTENT
              value: {{ .Values.api.persistence.enabled | quote }}
            - name: RH_CLUSTER_SERVER_CERT_MANAGED
              value: "false"
            - name: RH_PROXY_TRUSTED_IPS
              value: {{ .Values.api.proxyTrustedIps | quote }}
            {{- if .Values.api.clusterEnabled }}
            - name: RH_CLUSTER_ADVERTISE_IP
              valueFrom:
                fieldRef:
                  fieldPath: status.podIP
            {{- end }}
            - name: RH_HA_AUTO_JOIN
              value: {{ .Values.api.haAutoJoin | quote }}
            {{- if .Values.api.haPrimaryUrl }}
            - name: RH_HA_PRIMARY_URL
              value: {{ .Values.api.haPrimaryUrl | quote }}
            {{- end }}
            {{- if .Values.api.haServerCaSecretName }}
            - name: RH_HA_SERVER_CA_FILE
              value: /etc/rhorizon/ha-ca/ca.crt
            {{- end }}
            {{- if .Values.api.haPasswordSecretName }}
            - name: RH_HA_PASSWORD_FILE
              value: /run/secrets/rhorizon/ha-password
            {{- end }}
            - name: RH_WORKERS
              value: {{ .Values.api.workers | quote }}
            - name: RH_CUSTODY_MODE
              value: {{ .Values.api.custodyMode | quote }}
            - name: RH_CUSTODIAN_WORKERS
              value: {{ .Values.api.custodianWorkers | quote }}
            - name: RH_MAX_CONCURRENT_REQUESTS
              value: {{ .Values.api.maxConcurrentRequests | quote }}
            - name: RH_MEMORY_LOCK_MODE
              value: {{ .Values.api.memoryLockMode | quote }}
            - name: RH_SWAP_PROTECTION
              value: {{ .Values.api.swapProtection | quote }}
            - name: RH_PROXY_AUTH_ENABLED
              value: {{ .Values.api.proxyAuthEnabled | quote }}
            - name: RH_DYNAMIC_MODULES_FILE
              value: /app/dynamic-engines.ini
          startupProbe:
            {{- toYaml .Values.api.startupProbe | nindent 12 }}
          livenessProbe:
            {{- toYaml .Values.api.livenessProbe | nindent 12 }}
          readinessProbe:
            {{- toYaml .Values.api.readinessProbe | nindent 12 }}
          resources:
            {{- toYaml .Values.api.resources | nindent 12 }}
          {{- $apiSecurityContext := deepCopy .Values.api.containerSecurityContext }}
          {{- if not .Values.api.requestIpcLockCapability }}
          {{- $_ := unset $apiSecurityContext.capabilities "add" }}
          {{- end }}
          securityContext:
            {{- toYaml $apiSecurityContext | nindent 12 }}
          volumeMounts:
            - name: tmp
              mountPath: /tmp
            - name: shm
              mountPath: /dev/shm
            - name: rhorizon-runtime
              mountPath: /run/rhorizon
            - name: audit-logs
              mountPath: /var/log/rhorizon
            - name: rhorizon-data
              mountPath: /var/lib/rhorizon
            {{- if .Values.api.haPasswordSecretName }}
            - name: ha-password
              mountPath: /run/secrets/rhorizon
              readOnly: true
            {{- end }}
            {{- if .Values.api.haServerCaSecretName }}
            - name: ha-server-ca
              mountPath: /etc/rhorizon/ha-ca
              readOnly: true
            {{- end }}
            - name: dynamic-engines
              mountPath: /app/dynamic-engines.ini
              subPath: dynamic-engines.ini
              readOnly: true
      volumes:
        - name: tmp
          emptyDir:
            medium: Memory
            sizeLimit: 16Mi
        - name: shm
          emptyDir:
            medium: Memory
            sizeLimit: 1Mi
        - name: rhorizon-runtime
          emptyDir:
            medium: Memory
            sizeLimit: 1Mi
        - name: audit-logs
          emptyDir:
            sizeLimit: 100Mi
        {{- if not .Values.api.persistence.enabled }}
        # Development-only. HA rendering refuses ephemeral node identity.
        - name: rhorizon-data
          emptyDir:
            sizeLimit: 64Mi
        {{- end }}
        {{- if .Values.api.haPasswordSecretName }}
        - name: ha-password
          secret:
            secretName: {{ .Values.api.haPasswordSecretName | quote }}
            items:
              - key: {{ .Values.api.haPasswordSecretKey | quote }}
                path: ha-password
                mode: 0400
        {{- end }}
        {{- if .Values.api.haServerCaSecretName }}
        - name: ha-server-ca
          secret:
            secretName: {{ .Values.api.haServerCaSecretName | quote }}
            items:
              - key: {{ .Values.api.haServerCaSecretKey | quote }}
                path: ca.crt
                mode: 0444
        {{- end }}
        - name: dynamic-engines
          configMap:
            name: {{ printf "%s-dynamic-engines" (include "rhorizon.fullname" .) }}
      {{- with .Values.nodeSelector }}
      nodeSelector: {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations: {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity: {{- toYaml . | nindent 8 }}
      {{- end }}
  {{- if .Values.api.persistence.enabled }}
  volumeClaimTemplates:
    - metadata:
        name: rhorizon-data
      spec:
        accessModes: ["ReadWriteOnce"]
        {{- if .Values.api.persistence.storageClass }}
        storageClassName: {{ .Values.api.persistence.storageClass | quote }}
        {{- end }}
        resources:
          requests:
            storage: {{ .Values.api.persistence.size | quote }}
  {{- end }}

{{- if not .Values.postgres.external.enabled -}}
apiVersion: v1
kind: Service
metadata:
  name: {{ printf "%s-postgres" (include "rhorizon.fullname" .) }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "rhorizon.labels" . | nindent 4 }}
    app.kubernetes.io/component: postgres
spec:
  type: ClusterIP
  ports:
    - port: 5432
      targetPort: 5432
      name: postgres
  selector:
    {{- include "rhorizon.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: postgres
{{- end -}}

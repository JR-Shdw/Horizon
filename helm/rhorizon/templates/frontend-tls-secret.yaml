{{- if and .Values.frontend.enabled (or .Values.frontend.tls.enabled .Values.api.clusterEnabled) (not .Values.frontend.tls.secretName) }}
{{- /*
Self-signed terminator certificate for the internal JOIN and renewal hop.

`lookup` reuses the live Secret on upgrade. The certificate identity must stay
stable because joiners pin it through `api.haServerCaSecretName`.

`genSelfSignedCert` emits the CA:FALSE leaf required by the rustls server path.
*/}}
{{- $name := printf "%s-frontend-tls" (include "rhorizon.fullname" .) -}}
{{- $existing := lookup "v1" "Secret" .Release.Namespace $name -}}
{{- $svc := printf "%s-frontend" (include "rhorizon.fullname" .) -}}
{{- $altNames := list $svc (printf "%s.%s" $svc .Release.Namespace) (printf "%s.%s.svc" $svc .Release.Namespace) "localhost" -}}
{{- $cert := "" -}}
{{- $key := "" -}}
{{- if $existing -}}
{{- $cert = index $existing.data "tls.crt" -}}
{{- $key = index $existing.data "tls.key" -}}
{{- else -}}
{{- $gen := genSelfSignedCert $svc (list "127.0.0.1") $altNames 3650 -}}
{{- $cert = b64enc $gen.Cert -}}
{{- $key = b64enc $gen.Key -}}
{{- end -}}
apiVersion: v1
kind: Secret
type: kubernetes.io/tls
metadata:
  name: {{ $name }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "rhorizon.labels" . | nindent 4 }}
data:
  tls.crt: {{ $cert }}
  tls.key: {{ $key }}
{{- end }}

[package]
name = "rhorizon-custody-core"
version = "0.1.0"
edition = "2021"
license = "AGPL-3.0-or-later"
description = "Portable custody protocol and quorum invariants for Rhorizon."
repository = "https://github.com/JR-Shdw/Horizon"
authors = ["shdw <horizon@resurgamus.com>"]

[lib]
name = "rhorizon_custody_core"
path = "src/lib.rs"

[dependencies]
aes = { version = "0.8", features = ["zeroize"] }
aes-gcm = { version = "0.10", features = ["zeroize"] }
chacha20poly1305 = "0.10"
crypto_box = { version = "0.9.1", features = ["chacha20"] }
curve25519-dalek = { version = "4.1.3", features = ["zeroize"] }
ed25519-dalek = { version = "2", features = ["zeroize"] }
ghash = { version = "0.5", features = ["zeroize"] }
hmac = "0.12"
hkdf = "0.12"
# Already in the tree through memsec; used directly for the peer-credential
# syscalls and their per-target constants (hand-rolled values were wrong on
# non-mainstream architectures).
libc = "0.2"
memsec = "0.7"
polyval = { version = "0.6", features = ["zeroize"] }
serde_json = "1"
sha2 = "0.10"
subtle = "2.6"
zeroize = "1.8"

[dev-dependencies]
hex = "0.4"
proptest = "1"

[package]
name = "rhorizon-custodian"
version = "0.1.0"
edition = "2021"
license = "AGPL-3.0-or-later"
description = "Standalone local key custodian for Rhorizon."
repository = "https://github.com/JR-Shdw/Horizon"
authors = ["shdw <horizon@resurgamus.com>"]

[[bin]]
name = "rhorizon-custodian"
path = "src/main.rs"

[dependencies]
getrandom = "0.2"
hex = "0.4"
libc = "0.2"
rhorizon-custody-core = { path = "../custody-core" }
serde_json = "1"
zeroize = "1.8"

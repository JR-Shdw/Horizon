# Resurgamus Horizon - fail2ban filter for the auth-failure log.
# Install: cp to /etc/fail2ban/filter.d/rhorizon.conf
#
# Matches lines written by api/app/authfail.py, e.g.:
#   2026-04-13T14:23:45+0000 rhorizon AUTH_FAIL ip=192.168.1.42 type=invalid_token
#
# ip= and type= are sanitized at the source to [A-Za-z0-9._:/-], so a single
# log line can never be forged from caller-controlled input.
[Definition]
failregex = ^.*rhorizon AUTH_FAIL ip=<HOST> type=\S+\s*$
ignoreregex =
datepattern = ^%%Y-%%m-%%dT%%H:%%M:%%S%%z
